# Leaf MLP1 recording preset - hardware H.264 on the RK3566 VPU.
#
# h264_rkmpp encodes on the VPU rather than the CPU, so the video encode does not
# compete with the emulator. The device's own FFmpeg 4.4 cannot do this: it is
# built --disable-encoders with only mjpeg and png re-enabled for video, which
# is why RetroArch ships its own FFmpeg 6.1 under lib/ffmpeg.
#
# This is a CAPTURE preset, not a sharing format. It is tuned to be cheap enough
# to run underneath a game at full speed. Converting to something a phone or
# Discord plays inline is a separate pass that runs after the game exits, where
# nothing is real-time.

vcodec = h264_rkmpp

# FLAC, and this is load-bearing: real-time AAC encoding breaks audio OUTPUT on
# FCEUmm. Measured on device with an identical preset, only the codec differing:
#
#   core                   audio   result
#   Genesis Plus GX 50fps  aac     clean
#   Genesis Plus GX 60fps  aac     clean (twice)
#   FCEUmm 60fps           aac     crackle + apparent slowdown
#   FCEUmm 60fps           flac    clean
#
# The container was ruled out separately (AAC in Matroska on FCEUmm still
# crackles), as were the scale factor and the video push rate. The recording
# itself comes out perfect either way - 156s of wall-clock produced 156.266s of
# video at a flawless 60.10fps - so the defect is in live playback, not capture.
# The mechanism inside the AAC path is still unnamed; do not "simplify" this back
# to AAC without re-testing an NES title by ear.
#
# An earlier version of this file claimed FLAC was here because the build has no
# AAC encoder. That was wrong - config_components.h says CONFIG_AAC_ENCODER 1 -
# and the right answer arrived from the opposite direction.
acodec = flac

# Matroska streams linearly, so a recording cut short by a crash or a dead
# battery is still playable, where MP4 writes its index at finalisation and would
# leave nothing. The post-process pass produces the MP4, so capturing here costs
# no compatibility.
format = matroska

# pix_fmt is deliberately left unset. Setting it to bgr24 was tried and made
# things worse: duplicates went from 5 to 341 of 725 frames and the file shrank
# from 2.7 MB to 0.4 MB. h264_rkmpp reports yuv420p either way, so the encoder
# converts internally regardless and naming a format only changes what RetroArch
# hands it -- for the worse.

# Scale up BEFORE encoding. This costs almost nothing and buys a great deal: at a
# fixed 800k target, native came out 2.99 MB and 3x came out 2.92 MB. The bitrate
# is the cap, so the encoder spends it either way.
#
# What native cannot do is look good, and its loss is structural rather than
# compression: yuv420p stores chroma at half resolution, so a 256x224 frame
# carries only a 128x112 colour plane and single-pixel detail bleeds into its
# neighbours; every player then bilinear-scales the result, smearing every pixel
# rather than just block edges; and a 256x224 frame is a mere 16x14 macroblocks,
# so quantisation and deblocking chew through meaningful art. Raising the bitrate
# fixes none of it - SSIM against an ideal crisp reference moved only 0.881 to
# 0.898 across 800k to 2000k at native, while 2x moved 0.918 to 0.956.
#
# 3x is what is verified clean on device. Note that 2x scored HIGHER per byte in
# that sweep (0.941 vs 0.922 at 1200k, converging near 2000k) because 3x has 9x
# the pixels to spend the same bits on. That sweep used x264 on a workstation
# though, and this device encodes with h264_rkmpp, which needs more bitrate for
# equivalent quality - so 2x is a candidate, not a conclusion. Validate against
# rkmpp before changing this.
#
# Integer factors only: a fractional scale can yield odd dimensions, which H.264
# cannot represent in yuv420p.
scale_factor = 3.0

# Pixel art is deceptively hard for H.264 -- sharp edges and dither patterns --
# and h264_rkmpp is a hardware encoder, weaker per bit than x264. Headroom
# matters more than it would for camera video. At this setting 10 MB holds
# roughly 20-23 seconds, which is the figure to argue with when picking a sharing
# target.
video_bit_rate = 4000000

# No audio_bit_rate here on purpose: FLAC is lossless and ignores it. The audio
# bitrate that matters is the one the post-process pass hands to AAC.

# The VPU does the work, so threads only cover the muxing and colour conversion.
threads = 2

audio_enable = true
