# Leaf MLP1 recording preset - hardware H.264 on the RK3566 VPU.
#
# h264_rkmpp encodes on the VPU rather than the CPU, so the video encode does not
# compete with the emulator. The device's own FFmpeg 4.4 cannot do this: it is
# built --disable-encoders with only mjpeg and png re-enabled for video, which
# is why RetroArch ships its own FFmpeg 6.1 under lib/ffmpeg.
#
# This is a CAPTURE preset, not a sharing format. It is tuned to be cheap enough
# to run underneath a game at full speed. Converting to something a phone or
# Discord plays inline is a separate pass that runs after the game exits, where
# nothing is real-time.

vcodec = h264_rkmpp

# FLAC, and this is load-bearing: real-time AAC encoding breaks audio OUTPUT on
# FCEUmm. Measured on device with an identical preset, only the codec differing:
#
#   core                   audio   result
#   Genesis Plus GX 50fps  aac     clean
#   Genesis Plus GX 60fps  aac     clean (twice)
#   FCEUmm 60fps           aac     crackle + apparent slowdown
#   FCEUmm 60fps           flac    clean
#
# The container was ruled out separately (AAC in Matroska on FCEUmm still
# crackles), as were the scale factor and the video push rate. The recording
# itself comes out perfect either way - 156s of wall-clock produced 156.266s of
# video at a flawless 60.10fps - so the defect is in live playback, not capture.
# The mechanism inside the AAC path is still unnamed; do not "simplify" this back
# to AAC without re-testing an NES title by ear.
#
# An earlier version of this file claimed FLAC was here because the build has no
# AAC encoder. That was wrong - config_components.h says CONFIG_AAC_ENCODER 1 -
# and the right answer arrived from the opposite direction.
acodec = flac

# Matroska streams linearly, so a recording cut short by a crash or a dead
# battery is still playable, where MP4 writes its index at finalisation and would
# leave nothing. The post-process pass produces the MP4, so capturing here costs
# no compatibility.
#
# ⛔ Do NOT change this. Two things downstream assume Matroska and neither says so
# at the time you would find out: RetroArch names the output from the quality
# preset rather than the container, so any other format still lands as ".mkv"
# holding something else; and leaf-record-convert only picks up ".mkv", so a
# capture named anything else is skipped in silence and never converted. FLAC also
# needs a container that carries it, which MP4 effectively does not.
format = matroska

# ⛔ Recordings do NOT include shaders, and that is a decision rather than an
# oversight. RetroArch taps the core's raw framebuffer, so a CRT shader like
# Fugazi is invisible to it. video_gpu_record = true captures the GPU output
# instead and the shader does come through -- verified on device, the aperture
# grille is plainly there -- but it is unusable: glReadPixels stalls the render
# pipeline every frame on the Mali G52, and Eric measured 10+ seconds just for
# recording to start, with the game running badly throughout.
# It also forces scale_factor to 1.0, since GPU record already hands over the
# full viewport (940x720 here) and 3x would ask the VPU for 2880x2160.
# Do not enable it without a way to make the readback cheap.

# pix_fmt is deliberately left unset. Setting it to bgr24 was tried and made
# things worse: duplicates went from 5 to 341 of 725 frames and the file shrank
# from 2.7 MB to 0.4 MB. h264_rkmpp reports yuv420p either way, so the encoder
# converts internally regardless and naming a format only changes what RetroArch
# hands it -- for the worse.

# Scale up BEFORE encoding. This costs almost nothing and buys a great deal: at a
# fixed 800k target, native came out 2.99 MB and 3x came out 2.92 MB. The bitrate
# is the cap, so the encoder spends it either way.
#
# What native cannot do is look good, and its loss is structural rather than
# compression: yuv420p stores chroma at half resolution, so a 256x224 frame
# carries only a 128x112 colour plane and single-pixel detail bleeds into its
# neighbours; every player then bilinear-scales the result, smearing every pixel
# rather than just block edges; and a 256x224 frame is a mere 16x14 macroblocks,
# so quantisation and deblocking chew through meaningful art. Raising the bitrate
# fixes none of it - SSIM against an ideal crisp reference moved only 0.881 to
# 0.898 across 800k to 2000k at native, while 2x moved 0.918 to 0.956.
#
# 3x is verified clean on device and is the shipping choice. The x264 sweep had
# 2x scoring higher per byte (0.941 vs 0.922 at 1200k, converging near 2000k)
# since 3x has 9x the pixels for the same bits, and an on-device 2x-vs-3x pair was
# captured at 1200k - but both were starved there (97% and 101% utilisation) and a
# frame-matched score could not be obtained without contaminating it with
# alignment error. The comparison was dropped deliberately: at the bitrate we
# actually ship the two converge, and 3x is what was verified and preferred by eye.
# Reopen only with frame-aligned clips at 2500k.
#
# Integer factors only: a fractional scale can yield odd dimensions, which H.264
# cannot represent in yuv420p.
scale_factor = 3.0

# Pixel art is deceptively hard for H.264 -- sharp edges and dither patterns --
# and h264_rkmpp is a hardware encoder, weaker per bit than x264.
#
# 2500k was chosen BY EYE on device, Contra: Hard Corps (the most demanding thing
# in the library - screen-filling explosions over parallax scroll), against both
# neighbours on the same scene:
#
#   target   actual   util   10MB buys   verdict
#   1200k    1218k    101%   62s         clamped; visibly soft
#   1800k    1656k     92%   47s         smeared badly at one explosion
#   2500k    2205k     88%   35s         chosen - clearly crisper
#
# Note there is NO saturation knee. Utilisation sits at 83-94% whatever the cap
# (yesterday's clips at 4000k used 3657k/3320k/3757k), so the encoder simply
# spends most of what it is given and quality keeps improving above 2500k too.
# This is a quality-versus-clip-length tradeoff, not a sufficiency threshold.
# Ordinary content costs far less: the Contra and Metroid Fusion test scenes
# wanted only 676k and 751k, so typical clips run much longer than 35s per 10MB.
#
# Also note video_bit_rate is an AVERAGE target, not a ceiling - the 2500k clip
# peaked at 4071k in a single second.
video_bit_rate = 2500000

# ⛔ Do NOT add video_global_quality. It reaches the encoder (record_ffmpeg.c sets
# AV_CODEC_FLAG_QSCALE and global_quality from it) but h264_rkmpp does not honour
# it: asking for QP 23 gave 1908k and QP 20 gave 1821k, i.e. requesting HIGHER
# quality produced FEWER bits, with the peak falling too (3637k -> 3056k). The
# response is not monotonic, so constant-quality mode is not steerable here.
# Tested 07-30; do not retry without new evidence that the rkmpp wrapper changed.

# No audio_bit_rate here on purpose: FLAC is lossless and ignores it. The audio
# bitrate that matters is the one the post-process pass hands to AAC.

# The VPU does the work, so threads only cover the muxing and colour conversion.
threads = 2

audio_enable = true
